<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="color-scheme" content="light dark"><title>Nestrill • Mobile</title><link rel="stylesheet" href="/mobile/style.css"><script defer src="/mobile/app.js"></script></head>
<body><div class="shell">
  <header class="top"><div class="brand"><span class="brand-icon" aria-hidden="true">◈</span><span>Nestrill <small>Mobile</small></span></div><button id="logout" class="quiet hide" type="button">接続解除</button></header>
  <section id="login" class="login"><div class="login-card"><div class="login-icon">◈</div><h1>スマホ閲覧版</h1><p>PCの「スマホ接続を有効にする」で表示された8桁の接続コードを入力してください。</p><form id="login-form"><label for="pairing">接続コード</label><input id="pairing" type="text" inputmode="numeric" pattern="[0-9]{8}" maxlength="8" autocomplete="one-time-code" required placeholder="8桁の数字"><button type="submit" class="primary">接続する</button></form><p id="login-error" class="error" role="alert"></p><p class="muted small">同じWi-Fiに接続した端末でのみ使用してください。</p></div></section>
  <main id="app" class="hide"><section class="statusbar"><label class="visually-hidden" for="profile">プロファイル</label><span class="profile-picker-wrap"><select id="profile" aria-label="プロファイル"></select></span></section>
   <nav class="tabs" aria-label="表示切り替え"><button class="tab active" id="tab-rss" type="button">RSS記事</button><button class="tab" id="tab-ai" type="button">AIセレクト</button></nav>
   <section id="rss-view"><div class="filters"><label class="visually-hidden" for="category">カテゴリ</label><select id="category"><option value="">すべてのカテゴリ</option></select><label class="visually-hidden" for="feed">フィード</label><select id="feed"><option value="">すべてのフィード</option></select></div><div class="searchbar"><input id="search" type="search" placeholder="記事を検索" aria-label="記事を検索"><button id="search-btn" type="button">検索</button></div><div class="chips" role="group" aria-label="記事の絞り込み"><button class="chip active" data-filter="all" type="button">すべて</button><button class="chip" data-filter="unread" type="button">未読</button><button class="chip" data-filter="starred" type="button">お気に入り</button><button id="reload" class="reload" type="button" title="更新">↻ 更新</button></div><div id="articles" class="article-list" aria-live="polite"></div><div class="pager"><button id="prev" type="button">前のページ</button><span id="page"></span><button id="next" type="button">次のページ</button></div></section>
   <section id="ai-view" class="hide">
    <div class="discovery-switch" role="group" aria-label="記事探索モード"><button id="ai-normal" class="active" type="button" aria-pressed="true">AIセレクト</button><button id="ai-condition" type="button" aria-pressed="false">条件を指定して探す</button></div>
    <div id="ai-condition-controls" class="condition-controls hide">
      <h3>記事の探し方</h3><div class="discovery-switch" role="group" aria-label="記事の探し方"><button id="condition-latest" type="button" aria-pressed="false">新着順</button><button id="condition-random" class="active" type="button" aria-pressed="true">ランダム</button></div>
      <h3>今回の探索条件</h3><div class="condition-preferences"><label><input id="condition-interests" type="checkbox" checked>関心リストを使う</label><label><input id="condition-likes" type="checkbox" checked>「興味あり」を使う</label></div>
      <p class="muted small">OFFにしても保存済みの情報は消えません。両方OFFならGemmaも閲覧履歴も使用しません。</p>
      <h3>ジャンル選択</h3><div class="condition-reset-row"><button id="condition-reset" type="button">全チェック解除</button><span id="condition-count" class="muted small">ジャンル制限なし</span></div>
      <div id="condition-genres" class="condition-genres"></div>
      <p class="muted small">未選択ならジャンル制限なし。新着順はGoogleニュースの取得範囲です。</p>
    </div>
    <div class="ai-controls"><button id="e2-refresh" type="button">おすすめを更新</button></div><p id="ai-status" class="muted small" role="status"></p><div id="ai-items" class="article-list" aria-live="polite"></div><button id="condition-more" class="hide" type="button">取得済み候補の続きを表示</button>
   </section>
   <p id="notice" role="status" class="notice"></p>
  </main>
  <footer>PCが起動中の間、同一Wi-Fiで閲覧できます · Nestrill</footer>
</div></body></html>
